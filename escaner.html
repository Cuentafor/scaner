<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16324f">
<title>Escáner</title>
<style>
:root{--bar:56px;--pri:#1f6feb;--pri2:#16324f;--bg:#f4f6f9;--card:#fff;--txt:#1b2430;--mut:#6b7684;--line:#dde3ea;--ok:#1a7f37;--warn:#b35900}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.bar{position:sticky;top:0;z-index:20;height:calc(var(--bar) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0;display:flex;align-items:center;gap:8px;background:var(--pri2);color:#fff}
.bar h1{flex:1;font-size:18px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.15);white-space:nowrap}
.chip.ok{background:rgba(46,160,67,.35)}.chip.err{background:rgba(255,140,0,.35)}
button{font:inherit;cursor:pointer}
.icon{background:none;border:0;color:inherit;font-size:26px;width:40px;height:40px;line-height:1;border-radius:10px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--txt);padding:12px 14px;border-radius:12px;font-weight:600;min-height:46px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.small{padding:8px 12px;min-height:38px;font-size:14px}
.btn.ghost{background:transparent}
.btn.big{width:100%;font-size:19px;padding:18px;border-radius:16px}
main{max-width:900px;margin:0 auto}
section{padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
h2{font-size:15px;color:var(--mut);margin:22px 2px 10px;text-transform:uppercase;letter-spacing:.04em}
.empty,.muted{color:var(--mut)}
.empty{text-align:center;padding:30px 10px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px}
.item img{width:56px;height:72px;object-fit:cover;border-radius:6px;background:#e9edf2;flex:none}
.item .meta{flex:1;min-width:0}
.item .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta small{color:var(--mut)}
.item .icon{color:#b42318;font-size:20px}
.name{width:100%;font:inherit;font-weight:600;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.page{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.page img{display:block;width:100%;aspect-ratio:3/4;object-fit:contain;background:#e9edf2}
.pnum{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;font-weight:700;border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;padding:0 6px}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:#dbeafe;color:#1e40af;margin-left:6px}
.badge.image{background:#fde7d3;color:var(--warn)}
.page .badge{position:absolute;top:7px;right:6px;margin:0}
.pbtns{display:flex;border-top:1px solid var(--line)}
.pbtns button{flex:1;border:0;background:none;padding:9px 0;font-size:17px}
.pbtns button:disabled{opacity:.25}
.pbtns button+button{border-left:1px solid var(--line)}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(244,246,249,.96);border-top:1px solid var(--line);justify-content:center}
.actions .btn{flex:1;max-width:220px;padding:12px 4px;font-size:14px;white-space:nowrap}
/* Ráfaga */
#vCam{position:fixed;inset:0;z-index:30;padding:0;background:#000;display:flex;flex-direction:column}
#camStage{flex:1;position:relative;min-height:0}
#camVideo,#camOverlay{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#camOverlay{pointer-events:none}
#camFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#camFlash.go{animation:fl .25s ease-out}
@keyframes fl{from{opacity:.8}to{opacity:0}}
.camtop{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;z-index:2}
.camtop .seg{background:rgba(0,0,0,.55)}
.cambar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px calc(18px + env(safe-area-inset-bottom));background:#000}
.camleft{width:90px;display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:14px}
#camThumb{width:44px;height:58px;object-fit:cover;border-radius:6px;border:2px solid #fff}
#camShot{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #000}
#camShot:active{transform:scale(.92)}
#camDone{width:90px;background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px 0;font-weight:700}
/* Recorte */
#vCrop{position:fixed;top:calc(var(--bar) + env(safe-area-inset-top));left:0;right:0;bottom:0;padding:0;display:flex;flex-direction:column;background:#0e1116;z-index:10}
#stage{flex:1;position:relative;min-height:0}
#cropCv{position:absolute;inset:0;touch-action:none}
#loupe{position:absolute;top:10px;width:120px;height:120px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.5);pointer-events:none}
.tools{padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:#161b22}
.row{display:flex;gap:8px}
.row>.btn{flex:1}
.row.wrap{flex-wrap:wrap;align-items:center}
.tools .btn{background:#222a35;border-color:#333d4a;color:#e6edf3}
.tools .btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.seg{display:flex;background:#222a35;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:#aab4c0;padding:9px 4px;border-radius:9px;font-size:14px;font-weight:600}
.seg button.on{background:#e6edf3;color:#0e1116}
/* Texto */
select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
label{display:flex;align-items:center;gap:8px;flex:1;font-weight:600}
.tp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:12px}
.th{margin-bottom:6px;display:flex;align-items:center}
.tp textarea{width:100%;min-height:180px;font:15px/1.45 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical;margin-bottom:6px}
.tp p{margin:4px 0 8px}
/* Overlays */
#busy{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.6);display:grid;place-items:center}
#busy .box{background:#fff;border-radius:16px;padding:22px;width:min(320px,86vw);text-align:center}
.spin{width:36px;height:36px;margin:0 auto 10px;border:4px solid #dbe3ec;border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.prog{height:6px;background:#e5eaf0;border-radius:9px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;width:0;background:var(--pri);transition:width .2s}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
</style>
</head>
<body>
<header class="bar">
  <button id="back" class="icon" hidden aria-label="Volver">‹</button>
  <h1 id="title">Escáner</h1>
</header>

<main>
  <!-- INICIO -->
  <section id="vHome">
    <button id="btnNew" class="btn primary big">📷 Nuevo escaneo</button>
    <h2>Escaneos guardados</h2>
    <div id="docList"></div>
  </section>

  <!-- DOCUMENTO -->
  <section id="vDoc" hidden>
    <input id="docName" class="name" aria-label="Nombre del escaneo" maxlength="80">
    <div id="pages" class="grid"></div>
    <div class="actions">
      <button id="btnCam" class="btn primary">📷 Escanear</button>
      <button id="btnGal" class="btn">🖼 Galería</button>
      <button id="btnPdf" class="btn">📄 PDF</button>
      <button id="btnText" class="btn">🔤 Texto</button>
    </div>
  </section>

  <!-- RÁFAGA -->
  <section id="vCam" hidden>
    <div id="camStage">
      <video id="camVideo" playsinline muted autoplay></video>
      <canvas id="camOverlay"></canvas>
      <div id="camFlash"></div>
      <div class="camtop"><div class="seg" id="camMode"><button data-v="text">Texto impreso (OCR)</button><button data-v="image">A mano / imagen</button></div></div>
    </div>
    <div class="cambar">
      <div class="camleft"><img id="camThumb" hidden alt=""><span id="camCount">0</span></div>
      <button id="camShot" aria-label="Hacer foto"></button>
      <button id="camDone">Hecho ✓</button>
    </div>
  </section>

  <!-- RECORTE -->
  <section id="vCrop" hidden>
    <div id="stage"><canvas id="cropCv"></canvas><canvas id="loupe" hidden></canvas></div>
    <div class="tools">
      <div class="row">
        <button id="edAuto" class="btn small">✨ Auto</button>
        <button id="edAll" class="btn small">⬚ Toda</button>
        <button id="edRot" class="btn small">⟳ Girar</button>
      </div>
      <div class="seg" id="segFilter">
        <button data-v="original">Original</button><button data-v="mejorado">Mejorado</button><button data-v="gris">Gris</button><button data-v="bn">B/N</button>
      </div>
      <div class="seg" id="segMode">
        <button data-v="text">Texto impreso (OCR)</button><button data-v="image">A mano / imagen</button>
      </div>
      <div class="row">
        <button id="edCancel" class="btn">Cancelar</button>
        <button id="edOk" class="btn primary">Aplicar ✓</button>
      </div>
    </div>
  </section>

  <!-- TEXTO -->
  <section id="vText" hidden>
    <div class="row wrap">
      <label>Idioma
        <select id="langSel">
          <option value="spa">Castellano</option>
          <option value="eus">Euskera</option>
          <option value="spa+eus">Castellano + euskera</option>
        </select>
      </label>
      <button id="btnRun" class="btn small primary">Extraer texto</button>
    </div>
    <div id="txtPages"></div>
    <div class="actions">
      <button id="btnCopy" class="btn">📋 Copiar todo</button>
      <button id="btnTxt" class="btn">⬇ Descargar .txt</button>
    </div>
  </section>
</main>

<input type="file" id="inCam" accept="image/*" capture="environment" hidden>
<input type="file" id="inGal" accept="image/*" multiple hidden>

<div id="busy" hidden><div class="box"><div class="spin"></div><div id="busyMsg">Procesando…</div><div class="prog" id="busyProg"><i id="busyBar"></i></div></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
<script>
'use strict';
/* ================= Utilidades ================= */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const frame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const fmtDate = t => new Date(t).toLocaleString('es-ES', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
const safeName = s => (s || 'escaneo').replace(/[\\/:*?"<>|]+/g, '-').trim() || 'escaneo';
const store = {
  get(k, d){ try { const v = localStorage.getItem('esc_' + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('esc_' + k, JSON.stringify(v)); } catch(e){} }
};
const settings = { mode: store.get('mode', 'text'), filter: store.get('filter', 'mejorado'), lang: store.get('lang', 'spa') };

function loadImg(src){
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('imagen no válida')); i.src = src; });
}
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }
function busy(msg, pct){
  $('#busy').hidden = false; if (msg) $('#busyMsg').textContent = msg;
  $('#busyProg').hidden = pct == null; if (pct != null) $('#busyBar').style.width = Math.round(Math.max(0, Math.min(1, pct)) * 100) + '%';
}
function unbusy(){ $('#busy').hidden = true; }
function download(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ================= Base de datos (IndexedDB) ================= */
const DB = {
  db: null,
  open(){ return new Promise((res, rej) => {
    const r = indexedDB.open('escaner-db', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('docs', { keyPath: 'id' });
    r.onsuccess = () => { this.db = r.result; res(); };
    r.onerror = () => rej(r.error);
  }); },
  req(mode, fn){ return new Promise((res, rej) => {
    if (!this.db) return res(mode === 'readonly' ? [] : undefined);
    const r = fn(this.db.transaction('docs', mode).objectStore('docs'));
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }); },
  all(){ return this.req('readonly', s => s.getAll()); },
  put(d){ return this.req('readwrite', s => s.put(d)); },
  del(id){ return this.req('readwrite', s => s.delete(id)); }
};

/* ================= Navegación ================= */
let view = 'home', doc = null, ed = null;
function show(v){
  view = v;
  document.querySelectorAll('main>section').forEach(s => s.hidden = s.id !== 'v' + v[0].toUpperCase() + v.slice(1));
  $('#back').hidden = v === 'home';
  $('#title').textContent = { home:'Escáner', doc: doc ? doc.name : 'Escaneo', crop:'Recortar página', text:'Texto', cam:'Escanear' }[v];
  window.scrollTo(0, 0);
  if (v === 'crop') requestAnimationFrame(sizeCrop);
}
$('#back').onclick = () => {
  if (view === 'doc'){ doc = null; renderHome(); show('home'); }
  else if (view === 'crop'){ ed = null; show('doc'); }
  else if (view === 'cam'){ finishBurst(); }
  else if (view === 'text'){ renderDoc(); show('doc'); }
};

/* ================= Inicio ================= */
async function renderHome(){
  let docs = [];
  try { docs = (await DB.all()).sort((a, b) => b.updated - a.updated); } catch(e){}
  const list = $('#docList');
  if (!docs.length){ list.innerHTML = '<p class="empty">Aún no hay escaneos guardados.</p>'; return; }
  list.innerHTML = docs.map(d => `
    <div class="item" data-id="${d.id}">
      <img src="${d.pages[0] ? d.pages[0].thumb : ''}" alt="">
      <div class="meta"><b>${esc(d.name)}</b><small>${d.pages.length} pág. · ${fmtDate(d.updated)}</small></div>
      <button class="icon" data-del="${d.id}" aria-label="Borrar">🗑</button>
    </div>`).join('');
  list._docs = docs;
}
$('#docList').onclick = async e => {
  const del = e.target.closest('[data-del]');
  if (del){
    if (!confirm('¿Borrar este escaneo? No se puede deshacer.')) return;
    await DB.del(del.dataset.del); renderHome(); return;
  }
  const it = e.target.closest('.item'); if (!it) return;
  doc = $('#docList')._docs.find(d => d.id === it.dataset.id);
  if (doc){ renderDoc(); show('doc'); }
};
$('#btnNew').onclick = () => {
  doc = { id: uid(), name: 'Escaneo ' + fmtDate(Date.now()), created: Date.now(), updated: Date.now(), pages: [] };
  renderDoc(); show('doc');
  startBurst();
};

/* ================= Documento ================= */
let saveT;
async function saveDoc(){
  if (!doc || !doc.pages.length) return;
  doc.updated = Date.now();
  try { await DB.put(doc); } catch(e){ toast('No se pudo guardar (¿memoria llena?)'); }
}
function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(saveDoc, 600); }

function renderDoc(){
  $('#docName').value = doc.name;
  const g = $('#pages'), n = doc.pages.length;
  g.innerHTML = n ? doc.pages.map((p, i) => `
    <div class="page" data-i="${i}">
      <img src="${p.thumb}" data-act="edit" alt="Página ${i + 1}">
      <div class="pnum">${i + 1}</div>
      <span class="badge ${p.mode}">${p.mode === 'text' ? 'Texto' : 'Imagen'}</span>
      <div class="pbtns">
        <button data-act="up" ${i === 0 ? 'disabled' : ''} aria-label="Subir">↑</button>
        <button data-act="down" ${i === n - 1 ? 'disabled' : ''} aria-label="Bajar">↓</button>
        <button data-act="edit" aria-label="Editar">✎</button>
        <button data-act="del" aria-label="Borrar">🗑</button>
      </div>
    </div>`).join('')
    : '<p class="empty">Añade la primera página con la cámara o desde la galería.</p>';
  $('#btnPdf').disabled = $('#btnText').disabled = !n;
  if (view === 'doc') $('#title').textContent = doc.name;
}
$('#docName').oninput = e => { doc.name = e.target.value.trim() || 'Escaneo'; $('#title').textContent = doc.name; saveSoon(); };
$('#pages').onclick = async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const i = +b.closest('.page').dataset.i, P = doc.pages;
  switch (b.dataset.act){
    case 'up': [P[i - 1], P[i]] = [P[i], P[i - 1]]; break;
    case 'down': [P[i + 1], P[i]] = [P[i], P[i + 1]]; break;
    case 'del':
      if (!confirm(`¿Borrar la página ${i + 1}?`)) return;
      P.splice(i, 1);
      if (!P.length){ await DB.del(doc.id); renderDoc(); return; }
      break;
    case 'edit': return openEditor(P[i], i);
  }
  renderDoc(); saveDoc();
};
$('#btnCam').onclick = () => startBurst();
$('#btnGal').onclick = () => $('#inGal').click();
['#inCam', '#inGal'].forEach(id => $(id).onchange = e => { const f = [...e.target.files]; e.target.value = ''; handleFiles(f); });

async function newPageFromFile(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url);
    const w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, 2400 / Math.max(w, h));
    const c = mk(Math.round(w * k), Math.round(h * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return { id: uid(), original: c.toDataURL('image/jpeg', 0.9), corners: detectCorners(c),
             filter: settings.filter, mode: settings.mode, text: '', processed: '', thumb: '' };
  } finally { URL.revokeObjectURL(url); }
}
async function handleFiles(files){
  if (!files.length) return;
  try {
    if (files.length === 1){
      busy('Cargando foto…'); await frame();
      const p = await newPageFromFile(files[0]);
      unbusy(); openEditor(p, -1); return;
    }
    for (let i = 0; i < files.length; i++){
      busy(`Procesando ${i + 1} de ${files.length}…`, i / files.length); await frame();
      const p = await newPageFromFile(files[i]);
      await processPage(p); doc.pages.push(p);
    }
    await saveDoc(); renderDoc();
    toast('Páginas añadidas. Toca una para ajustar el recorte.');
  } catch(err){ console.error(err); toast('No se pudo abrir la imagen'); }
  finally { unbusy(); }
}

/* ================= Detección de bordes (JS propio, ligero) ================= */
function orderCorners(pts){
  const by = f => pts.reduce((a, b) => f(b) < f(a) ? b : a);
  const byMax = f => pts.reduce((a, b) => f(b) > f(a) ? b : a);
  return [ by(p => p.x + p.y), by(p => p.y - p.x), byMax(p => p.x + p.y), byMax(p => p.y - p.x) ]
    .map(p => ({ x: p.x, y: p.y })); // tl, tr, br, bl
}
function defaultCorners(w, h, m = 0.04){
  return [{x:w*m, y:h*m}, {x:w*(1-m), y:h*m}, {x:w*(1-m), y:h*(1-m)}, {x:w*m, y:h*(1-m)}];
}
function otsu(G){
  const hist = new Float64Array(256); for (let i = 0; i < G.length; i++) hist[G[i]]++;
  const n = G.length; let sum = 0; for (let v = 0; v < 256; v++) sum += v * hist[v];
  let sB = 0, wB = 0, best = 0, t = 128;
  for (let v = 0; v < 256; v++){
    wB += hist[v]; if (!wB) continue; const wF = n - wB; if (!wF) break;
    sB += v * hist[v]; const mB = sB / wB, mF = (sum - sB) / wF, b = wB * wF * (mB - mF) * (mB - mF);
    if (b > best){ best = b; t = v; }
  }
  return t;
}
function morph(M, w, h, dilate){ // 3x3 erosión / dilatación
  const O = new Uint8Array(M.length);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    let v = dilate ? 0 : 1;

(() => {

/* ================= Escaneo en ráfaga (cámara propia) ================= */
const cam = { stream: null, timer: null, queue: Promise.resolve(), pending: 0, count: 0, busy: false };

async function startBurst(){

    $('#inCam').click(); return;
  }

}
function sizeCamOverlay(){
  const o = $('#camOverlay'), st = $('#camStage'), dpr = window.devicePixelRatio || 1;
  o.width = st.clientWidth * dpr; o.height = st.clientHeight * dpr;
}

function liveDetect(){
  const v = $('#camVideo'), o = $('#camOverlay'), x = o.getContext('2d'), dpr = window.devicePixelRatio || 1;
  const vw = v.videoWidth, vh = v.videoHeight; if (!vw || !vh) return;
  const s = Math.min(1, 300 / Math.max(vw, vh)), c = mk(Math.round(vw * s), Math.round(vh * s));
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  const cr = detectCorners(c), full = cr[0].x === 0 && cr[0].y === 0;
  const W = o.width / dpr, H = o.height / dpr, k = Math.min(W / c.width, H / c.height);
  const ox = (W - c.width * k) / 2, oy = (H - c.height * k) / 2;
  x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, W, H);
  const def = Math.abs(cr[0].x - c.width * 0.04) < 0.5 && Math.abs(cr[0].y - c.height * 0.04) < 0.5;
  if (def || full) return; // no se ha encontrado hoja
  x.beginPath(); cr.forEach((q, i) => x[i ? 'lineTo' : 'moveTo'](ox + q.x * k, oy + q.y * k)); x.closePath();
  x.fillStyle = 'rgba(63,169,255,.18)'; x.fill(); x.lineWidth = 3; x.strokeStyle = '#3fa9ff'; x.stroke();
}

    } catch(e){ /* sigue con el fotograma de vídeo */ }

  const v = $('#camVideo'), c = mk(v.videoWidth, v.videoHeight);

        const p = await newPageFromFile(blob); p.mode = mode;
        await processPage(p); doc.pages.push(p); await saveDoc();
        const t = $('#camThumb'); t.src = p.thumb; t.hidden = false;
      } catch(e){ console.error(e); cam.count--; toast('Una foto no se pudo procesar'); }
      cam.pending--; camUI();
    });
  } catch(e){ toast('No se pudo hacer la foto'); }
  finally { cam.busy = false; }
};
$('#camMode').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  settings.mode = b.dataset.v; store.set('mode', settings.mode); camUI();
};
function stopCam(){
  clearInterval(cam.timer); cam.timer = null;
  if (cam.stream){ cam.stream.getTracks().forEach(t => t.stop()); cam.stream = null; }
  $('#camVideo').srcObject = null;
}
async function finishBurst(){
  stopCam();
  if (cam.pending){ busy('Terminando de procesar…'); await cam.queue; unbusy(); }
  renderDoc(); show('doc');
  if (cam.count) toast(`${cam.count} página(s) añadidas. Toca una para retocar el recorte.`);
}
$('#camDone').onclick = finishBurst;
document.addEventListener('visibilitychange', () => { if (document.hidden && view === 'cam') finishBurst(); });

/* ================= PDF ================= */
$('#btnPdf').onclick = async () => {
  if (!doc.pages.length) return;
  if (!window.jspdf){ toast('El generador de PDF no se ha cargado. Revisa la conexión.'); return; }
  busy('Creando PDF…', 0); await frame();
  try {
    const { jsPDF } = window.jspdf; let pdf = null;
    for (let i = 0; i < doc.pages.length; i++){
      const p = doc.pages[i], orient = p.w > p.h ? 'l' : 'p';
      if (!pdf) pdf = new jsPDF({ orientation: orient, unit: 'mm', format: 'a4', compress: true });
      else pdf.addPage('a4', orient);
      const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight(), m = 6;
      const k = Math.min((pw - 2 * m) / p.w, (ph - 2 * m) / p.h), w = p.w * k, h = p.h * k;
      pdf.addImage(p.processed, 'JPEG', (pw - w) / 2, (ph - h) / 2, w, h, undefined, 'FAST');
      busy(null, (i + 1) / doc.pages.length); await frame();
    }
    download(pdf.output('blob'), safeName(doc.name) + '.pdf');
  } catch(e){ console.error(e); toast('Error al crear el PDF'); }
  finally { unbusy(); }
};

/* ================= Texto (OCR) ================= */
let ocrWorker = null, ocrLang = null, ocrBusy = false, ocrProgress = null;
async function getWorker(lang){
  if (ocrWorker && ocrLang === lang) return ocrWorker;
  if (ocrWorker){ try { await ocrWorker.terminate(); } catch(e){} ocrWorker = null; }
  ocrWorker = await Tesseract.createWorker(lang, 1, { logger: m => ocrProgress && ocrProgress(m) });
  ocrLang = lang; return ocrWorker;
}
const cleanText = t => (t || '')
  .replace(/([a-záéíóúüñ])-\n([a-záéíóúüñ])/gi, '$1$2')
  .replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();

function renderText(){
  $('#langSel').value = settings.lang;
  $('#txtPages').innerHTML = doc.pages.map((p, i) => {
    const head = `<div class="th"><b>Página ${i + 1}</b>${p.mode === 'image' ? '<span class="badge image">Imagen</span>' : ''}</div>`;
    if (p.mode === 'image' && !p.text)
      return `<div class="tp">${head}<p class="muted">Guardada como imagen, sin extraer texto.</p><button class="btn small" data-ocr="${i}">Extraer texto de esta página</button></div>`;
    return `<div class="tp">${head}<textarea data-i="${i}" placeholder="Sin texto todavía">${esc(p.text || '')}</textarea><button class="btn small ghost" data-ocr="${i}">${p.text ? 'Volver a leer' : 'Leer esta página'}</button></div>`;
  }).join('');
}
$('#txtPages').addEventListener('input', e => { const t = e.target.closest('textarea'); if (!t) return; doc.pages[+t.dataset.i].text = t.value; saveSoon(); });
$('#txtPages').addEventListener('click', e => { const b = e.target.closest('[data-ocr]'); if (b) runOCR([+b.dataset.ocr]); });
$('#langSel').onchange = e => { settings.lang = e.target.value; store.set('lang', settings.lang); };
const pending = () => doc.pages.map((p, i) => i).filter(i => doc.pages[i].mode === 'text' && !doc.pages[i].text);
$('#btnText').onclick = () => { renderText(); show('text'); if (pending().length) runOCR(pending()); };
$('#btnRun').onclick = () => {
  const list = pending();
  if (list.length) return runOCR(list);
  const all = doc.pages.map((p, i) => i).filter(i => doc.pages[i].mode === 'text');
  if (!all.length){ toast('Todas las páginas están en modo imagen. Usa "Extraer texto de esta página".'); return; }
  if (confirm('Ya hay texto extraído. ¿Volver a leer todas las páginas de texto? Se perderán los cambios hechos a mano.')) runOCR(all);
};
async function runOCR(indices){
  if (ocrBusy || !indices.length) return;
  if (!window.Tesseract){ toast('El lector de texto no se ha cargado. Revisa la conexión.'); return; }
  ocrBusy = true;
  try {
    const n = indices.length;
    for (let k = 0; k < n; k++){
      const i = indices[k], label = `Leyendo página ${i + 1}${n > 1 ? ` (${k + 1} de ${n})` : ''}…`;
      busy(label, k / n);
      ocrProgress = m => {
        if (m.status === 'recognizing text') busy(label, (k + m.progress) / n);
        else busy('Preparando el lector de texto (la primera vez tarda más)…', null);
      };
      const w = await getWorker(settings.lang);
      busy(label, k / n);
      const { data } = await w.recognize(doc.pages[i].processed);
      doc.pages[i].text = cleanText(data.text) || '(no se ha encontrado texto)';
    }
    await saveDoc(); renderText(); toast('Texto extraído. Puedes corregirlo aquí mismo.');
  } catch(e){ console.error(e); toast('Error al leer el texto: ' + (e.message || e)); }
  finally { ocrBusy = false; ocrProgress = null; unbusy(); }
}
function allText(){
  const withText = doc.pages.map((p, i) => ({ i, t: (p.text || '').trim() })).filter(x => x.t && x.t !== '(no se ha encontrado texto)');
  if (withText.length <= 1) return withText.length ? withText[0].t : '';
  return withText.map(x => `— Página ${x.i + 1} —\n${x.t}`).join('\n\n');
}
$('#btnCopy').onclick = async () => {
  const t = allText(); if (!t){ toast('Todavía no hay texto'); return; }
  try { await navigator.clipboard.writeText(t); }
  catch(e){ const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch(_){} a.remove(); }
  toast('Texto copiado');
};
$('#btnTxt').onclick = () => {
  const t = allText(); if (!t){ toast('Todavía no hay texto'); return; }
  download(new Blob(['﻿' + t], { type: 'text/plain;charset=utf-8' }), safeName(doc.name) + '.txt');
};

/* ================= Arranque ================= */
(async () => {
  try { await DB.open(); } catch(e){ toast('Este navegador no permite guardar el historial'); }
  renderHome();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
})();
</script>
