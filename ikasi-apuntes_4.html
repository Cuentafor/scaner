/* Trozos de texto con formato: b negrita, i cursiva, del tachado, mark añadido, fix corrección, math fórmula */
function runs(s,f){
  f=f||{};const out=[];const re=/\$\$(.+?)\$\$|\$(?![\s$])([^$\n]+?)\$|\\\((.+?)\\\)|~~(.+?)~~|==(.+?)==|\*\*(.+?)\*\*|\*([^*\s][^*]*?)\*/g;let last=0,m;
  while((m=re.exec(s))){
    if(m.index>last)out.push(Object.assign({t:s.slice(last,m.index)},f));
    if(m[1]!==undefined||m[2]!==undefined||m[3]!==undefined)out.push(Object.assign({},f,{t:m[1]||m[2]||m[3],math:true}));
    else if(m[4]!==undefined)out.push(...runs(m[4],Object.assign({},f,{del:true})));
    else if(m[5]!==undefined)out.push(...runs(m[5],Object.assign({},f,{mark:true})));
    else if(m[6]!==undefined)out.push(...runs(m[6],Object.assign({},f,{b:true})));
    else out.push(...runs(m[7],Object.assign({},f,{i:true})));
    last=re.lastIndex;
  }
  if(last<s.length)out.push(Object.assign({t:s.slice(last)},f));
  return out;
}
function fixRuns(rs){let last=null;for(const r of rs){if(!r.t.trim())continue;if(r.b&&!r.del&&last&&(last.del||last.fix))r.fix=true;last=r;}return rs;}
const inlineRuns=s=>fixRuns(runs(String(s==null?"":s)));

const GREEK={alpha:"α",beta:"β",gamma:"γ",delta:"δ",Delta:"Δ",epsilon:"ε",varepsilon:"ε",theta:"θ",lambda:"λ",mu:"μ",nu:"ν",pi:"π",rho:"ρ",sigma:"σ",Sigma:"Σ",tau:"τ",phi:"φ",varphi:"φ",omega:"ω",Omega:"Ω",eta:"η",Gamma:"Γ",Phi:"Φ",Lambda:"Λ",Pi:"Π",Theta:"Θ",chi:"χ",psi:"ψ",kappa:"κ",xi:"ξ",zeta:"ζ"};

const SUP={"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","+":"⁺","-":"⁻","−":"⁻","=":"⁼","(":"⁽",")":"⁾","n":"ⁿ","i":"ⁱ"};
const SUB={"0":"₀","1":"₁","2":"₂","3":"₃","4":"₄","5":"₅","6":"₆","7":"₇","8":"₈","9":"₉","+":"₊","-":"₋","=":"₌","(":"₍",")":"₎"};
function texText(tex){
  let s=String(tex);
  const grp="\\{((?:[^{}]|\\{[^{}]*\\})*)\\}";
  for(let k=0;k<4;k++){
    s=s.replace(new RegExp("\\\\[dt]?frac\\s*"+grp+"\\s*"+grp,"g"),(m,a,b)=>`(${a})/(${b})`)
     .replace(new RegExp("\\\\sqrt\\s*\\[([^\\]]*)\\]\\s*"+grp,"g"),(m,n,a)=>`${n}√(${a})`)
     .replace(new RegExp("\\\\sqrt\\s*"+grp,"g"),(m,a)=>`√(${a})`)
     .replace(new RegExp("\\\\(?:vec|overrightarrow)\\s*"+grp,"g"),(m,a)=>a+"\u20D7")
     .replace(new RegExp("\\\\(?:text|mathrm|mathbf|mathit|operatorname|textbf|textit|mbox)\\s*"+grp,"g"),"$1")
     .replace(new RegExp("\\\\(?:hat|bar|overline|dot)\\s*"+grp,"g"),"$1");
  }
  s=s.replace(/\\left|\\right|\\displaystyle|\\limits/g,"").replace(/\\[,;:!]/g," ").replace(/\\\\/g," ")
   .replace(/\\([A-Za-z]+)/g,(m,w)=>GREEK[w]||SYM[w]||w)
   .replace(new RegExp("\\^"+grp,"g"),(m,a)=>[...a].every(c=>SUP[c])?[...a].map(c=>SUP[c]).join(""):"^("+a+")")
   .replace(/\^(.)/g,(m,c)=>SUP[c]||"^"+c)
   .replace(new RegExp("_"+grp,"g"),(m,a)=>[...a].every(c=>SUB[c])?[...a].map(c=>SUB[c]).join(""):"_"+a)
   .replace(/_(.)/g,(m,c)=>SUB[c]||"_"+c)
   .replace(/[{}]/g,"").replace(/\s+/g," ").trim();

}

function parseTable(lines){

  const rows=lines.map(cells);let head=null;

function blocks(src){

      while(i<L.length&&!/^\s*```\s*$/.test(L[i])){buf.push(L[i]);i++;}

    if(/^\s*<svg[\s>]/i.test(l)){fp();fl();const buf=[l];while(!/<\/svg>\s*$/i.test(buf[buf.length-1])&&i+1<L.length){i++;buf.push(L[i]);}out.push({k:"svg",code:buf.join("\n")});continue;}
    if(/^\s*(\$\$|\\\[)/.test(l)){fp();fl();const open=l.trim().startsWith("$$")?"$$":"\\[",close=open==="$$"?"$$":"\\]";
      let body=l.trim().slice(2);

const CFILL={formula:["#E5EBFA","#2348B8"],ejemplo:["#E2F2E9","#1B7F52"],error:["#FAE4E7","#C42339"],importante:["#FAEFD6","#A16400"],nota:["#ECEFF5","#596379"]};

async function toPdf(model){
  await loadScript(LIB.pdf);await loadScript(LIB.vfs);
  const pr=rs=>rs.map(r=>{const o={text:String(r.t).replace(/\u20D7/g,"")};if(r.b)o.bold=true;if(r.i)o.italics=true;if(r.del){o.decoration="lineThrough";o.color="#7A8294";}if(r.fix)o.color="#C42339";if(r.mark)o.background="#EDF26B";return o;});
  const line=top=>({canvas:[{type:"line",x1:0,y1:0,x2:515,y2:0,lineWidth:.6,lineColor:"#B9C0CE"}],margin:[0,top,0,0]});
  const thin={hLineWidth:()=>.6,vLineWidth:()=>.6,hLineColor:()=>"#C9CFDB",vLineColor:()=>"#C9CFDB",paddingLeft:()=>6,paddingRight:()=>6,paddingTop:()=>4,paddingBottom:()=>4};
  const conv=items=>{const c=[];items.forEach(b=>{
    if(b.k==="title")c.push({text:b.t,style:"title"});
    else if(b.k==="meta")c.push({text:b.t,style:"meta"});
    else if(b.k==="h")c.push({text:pr(b.runs),style:"h"+b.lv});
    else if(b.k==="p")c.push({text:pr(b.runs),margin:[0,2,0,6]});
    else if(b.k==="q")c.push({stack:conv(b.children),italics:true,color:"#596379",margin:[12,2,0,6]});
    else if(b.k==="ul")c.push({ul:b.items.map(x=>({text:pr(x)})),margin:[0,2,0,6]});
    else if(b.k==="ol")c.push({ol:b.items.map(x=>({text:pr(x)})),margin:[0,2,0,6]});
    else if(b.k==="hr")c.push(line(8),{text:"",margin:[0,0,0,6]});
    else if(b.k==="math")c.push({text:String(b.t).replace(/\u20D7/g,""),italics:true,alignment:"center",fontSize:12,margin:[0,6,0,8]});
    else if(b.k==="code")c.push({text:b.t,fontSize:9,preserveLeadingSpaces:true,color:"#333333",margin:[0,4,0,8]});
    else if(b.k==="table"){const n=Math.max(...[b.head||[],...b.rows].map(r=>r.length),1);const fill=r=>{const a=r.map(x=>({text:pr(x)}));while(a.length<n)a.push({text:""});return a;};
      const body=[];if(b.head)body.push(fill(b.head).map(x=>Object.assign(x,{bold:true,fillColor:"#ECEFF5"})));b.rows.forEach(r=>body.push(fill(r)));
      c.push({table:{headerRows:b.head?1:0,widths:Array(n).fill("*"),body},layout:thin,fontSize:10,margin:[0,4,0,10]});}
    else if(b.k==="callout"){const f=CFILL[b.kind]||CFILL.nota;
      c.push({table:{widths:["*"],body:[[{stack:[{text:pr(b.title),bold:true,color:f[1],fontSize:9.5,margin:[0,0,0,4]},...conv(b.children)],fillColor:f[0]}]]},
        layout:{hLineWidth:()=>1,vLineWidth:()=>1,hLineColor:()=>f[1],vLineColor:()=>f[1],paddingLeft:()=>10,paddingRight:()=>10,paddingTop:()=>8,paddingBottom:()=>6},margin:[0,6,0,10]});}
    else if(b.k==="svg"){if(svgOk(b.code))c.push({svg:b.code,width:400,alignment:"center",margin:[0,6,0,6]});}
    else if(b.k==="qh")c.push({text:[...pr(b.runs),{text:"   ("+b.tag+")",fontSize:9,color:"#596379",bold:false}],margin:[0,14,0,6],fontSize:12});
    else if(b.k==="opt")c.push({text:pr(b.runs),margin:[14,3,0,3]});
    else if(b.k==="lines")for(let i=0;i<b.n;i++)c.push(line(i?20:22));
  });return c;};
  const dd={pageSize:"A4",pageMargins:[40,48,40,48],content:conv(model),defaultStyle:{fontSize:11,lineHeight:1.25},
    styles:{title:{fontSize:20,bold:true,margin:[0,0,0,2]},meta:{fontSize:10,color:"#596379",margin:[0,0,0,12]},h1:{fontSize:16,bold:true,margin:[0,12,0,4]},h2:{fontSize:14,bold:true,margin:[0,10,0,4]},h3:{fontSize:12,bold:true,margin:[0,8,0,2]},h4:{fontSize:11,bold:true,margin:[0,6,0,2]}}};
  return new Promise((res,rej)=>{try{window.pdfMake.createPdf(dd).getBlob(res);}catch(e){rej(e);}});

function svgToPng(code){return new Promise(res=>{try{
  const img=new Image();img.onload=()=>{try{const W=Math.min(1200,(img.naturalWidth||600)*2),H=Math.round(W*((img.naturalHeight||400)/(img.naturalWidth||600)));
    const cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);x.drawImage(img,0,0,W,H);
    cv.toBlob(b=>{if(!b)return res(null);b.arrayBuffer().then(buf=>res({data:new Uint8Array(buf),w:W,h:H}));},"image/png");}catch(e){res(null);}};
  img.onerror=()=>res(null);img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(code);}catch(e){res(null);}});}
async function toDocx(model){
  await loadScript(LIB.docx);const D=window.docx;
  const pngs=new Map();const walk=items=>items.forEach(b=>{if(b.k==="svg")pngs.set(b,null);if(b.children)walk(b.children);});walk(model);
  for(const b of pngs.keys())pngs.set(b,await svgToPng(b.code));
  const tr=(rs,ex)=>rs.map(r=>r.br?new D.TextRun({text:"",break:1}):new D.TextRun(Object.assign({text:r.t,bold:!!r.b,italics:!!r.i,strike:!!r.del},r.fix?{color:"C42339"}:r.del?{color:"7A8294"}:{},r.mark?{highlight:"yellow"}:{},ex||{})));
  const H=[D.HeadingLevel.HEADING_1,D.HeadingLevel.HEADING_2,D.HeadingLevel.HEADING_3,D.HeadingLevel.HEADING_4];
  const rule=before=>new D.Paragraph({spacing:{before},border:{bottom:{color:"999999",space:1,style:D.BorderStyle.SINGLE,size:6}},children:[]});
  const bd=c=>({top:{style:D.BorderStyle.SINGLE,size:6,color:c},bottom:{style:D.BorderStyle.SINGLE,size:6,color:c},left:{style:D.BorderStyle.SINGLE,size:6,color:c},right:{style:D.BorderStyle.SINGLE,size:6,color:c}});
  let olN=0;
  const conv=items=>{const ch=[];items.forEach(b=>{
    if(b.k==="title")ch.push(new D.Paragraph({heading:D.HeadingLevel.TITLE,children:[new D.TextRun(b.t)]}));
    else if(b.k==="meta")ch.push(new D.Paragraph({spacing:{after:200},children:[new D.TextRun({text:b.t,color:"596379",size:20})]}));
    else if(b.k==="h")ch.push(new D.Paragraph({heading:H[b.lv-1]||H[3],children:tr(b.runs)}));
    else if(b.k==="p")ch.push(new D.Paragraph({spacing:{after:120},children:tr(b.runs)}));
    else if(b.k==="q")conv(b.children).forEach(x=>ch.push(x));
    else if(b.k==="ul")b.items.forEach(it=>ch.push(new D.Paragraph({bullet:{level:0},children:tr(it)})));
    else if(b.k==="ol"){olN++;b.items.forEach(it=>ch.push(new D.Paragraph({numbering:{reference:"num",level:0,instance:olN},children:tr(it)})));}
    else if(b.k==="hr")ch.push(rule(120));
    else if(b.k==="math")ch.push(new D.Paragraph({alignment:D.AlignmentType.CENTER,spacing:{before:120,after:120},children:[new D.TextRun({text:b.t,italics:true,size:24})]}));
    else if(b.k==="code")b.t.split("\n").forEach(l=>ch.push(new D.Paragraph({children:[new D.TextRun({text:l,font:"Consolas",size:18})]})));
    else if(b.k==="table"){const n=Math.max(...[b.head||[],...b.rows].map(r=>r.length),1);
      const mk=(r,head)=>new D.TableRow({tableHeader:!!head,children:Array.from({length:n},(_,j)=>new D.TableCell({shading:head?{fill:"ECEFF5"}:undefined,margins:{top:60,bottom:60,left:100,right:100},children:[new D.Paragraph({children:tr(r[j]||[],head?{bold:true}:null)})]}))});
      const rows=[];if(b.head)rows.push(mk(b.head,true));b.rows.forEach(r=>rows.push(mk(r,false)));
      ch.push(new D.Table({rows,width:{size:100,type:D.WidthType.PERCENTAGE}}));ch.push(new D.Paragraph({children:[]}));}
    else if(b.k==="callout"){const f=CFILL[b.kind]||CFILL.nota;
      ch.push(new D.Table({width:{size:100,type:D.WidthType.PERCENTAGE},rows:[new D.TableRow({children:[new D.TableCell({shading:{fill:f[0].slice(1)},borders:bd(f[1].slice(1)),margins:{top:120,bottom:120,left:160,right:160},
        children:[new D.Paragraph({spacing:{after:80},children:tr(b.title,{bold:true,color:f[1].slice(1),size:18,allCaps:true})}),...conv(b.children)]})]})]}));
      ch.push(new D.Paragraph({children:[]}));}
    else if(b.k==="svg"){const p=pngs.get(b);if(p){const w=Math.min(450,p.w/2),h=Math.round(w*p.h/p.w);ch.push(new D.Paragraph({alignment:D.AlignmentType.CENTER,children:[new D.ImageRun({data:p.data,transformation:{width:w,height:h}})]}));}}
    else if(b.k==="qh")ch.push(new D.Paragraph({spacing:{before:280,after:100},children:[...tr(b.runs),new D.TextRun({text:"   ("+b.tag+")",color:"596379",size:18})]}));
    else if(b.k==="opt")ch.push(new D.Paragraph({indent:{left:360},spacing:{after:60},children:tr(b.runs)}));
    else if(b.k==="lines")for(let i=0;i<b.n;i++)ch.push(rule(320));
  });return ch;};
  const doc=new D.Document({
    styles:{default:{document:{run:{font:"Calibri",size:22}}}},
    numbering:{config:[{reference:"num",levels:[{level:0,format:D.LevelFormat.DECIMAL,text:"%1.",alignment:D.AlignmentType.START,style:{paragraph:{indent:{left:720,hanging:360}}}}]}]},
    sections:[{properties:{},children:conv(model)}]});
  return D.Packer.toBlob(doc);
}

## Teoría celular
- Todos los seres vivos están formados por una o más células.
- La célula es la unidad ~~mas pequeña~~ **más pequeña** con vida propia.
- ==Toda célula procede de otra célula ya existente (Virchow, 1855).==

## Tipos de células
### Procariotas
- No tienen núcleo: el ADN está libre en el citoplasma.
- Ejemplo: las bacterias.

### Eucariotas
- Tienen núcleo, rodeado por una membrana ~~simple~~ **doble** (envoltura nuclear).
- Pueden ser animales o vegetales.

## Célula animal y célula vegetal
- La célula vegetal tiene **pared celular** de celulosa y **cloroplastos**.
- ==La vegetal suele tener una vacuola grande; la animal, varias pequeñas.==
- La célula animal tiene centriolos.

## Resumen
- Todos los seres vivos están formados por células.
- Las procariotas no tienen núcleo; las eucariotas sí.
- Solo la célula vegetal tiene pared celular y cloroplastos.

## Vocabulario
- **Orgánulo**: estructura de la célula con una función concreta.
- **Cloroplasto**: orgánulo donde se hace la fotosíntesis.
- **Mitocondria**: orgánulo donde se obtiene energía (respiración celular).`;

- Izaki bizidun guztiak zelula batez edo gehiagoz osatuta daude.
